onboarding = false
[keys]
# Prefix used before Herdr-specific shortcuts.
prefix = "ctrl+a"

# Keep Ctrl+W and Ctrl+N available to shells and editors.
workspace_picker = "prefix+w"
zoom = "prefix+z"

# Browse/search/copy pane history in $EDITOR without using the outer terminal.
edit_scrollback = "prefix+e"

# Leave the session running; this does not close panes or stop their processes.
detach = "prefix+q"

# Prefix bindings work across terminals; Cmd bindings are optional Mac shortcuts.
focus_pane_left = ["prefix+h", "cmd+left"]
focus_pane_right = ["prefix+l", "cmd+right"]
focus_pane_up = ["prefix+k", "cmd+up"]
focus_pane_down = ["prefix+j", "cmd+down"]

# Move between tabs in the current workspace.
previous_tab = ["prefix+p", "cmd+ctrl+left"]
next_tab = ["prefix+n", "cmd+ctrl+right"]

# Move between workspaces.
previous_workspace = ["prefix+ctrl+p", "cmd+ctrl+up"]
next_workspace = ["prefix+ctrl+n", "cmd+ctrl+down"]

[[keys.command]]
# Open lazygit in a session popup without changing the tab layout.
key = "prefix+ctrl+g"
type = "popup"
description = "Open lazygit"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
# Review working tree changes with hunk in a session popup.
key = "prefix+ctrl+h"
type = "popup"
description = "Open hunk diff"
command = "hunk diff"
width = "90%"
height = "90%"

[[keys.command]]
# Open a temporary Neovim pane from the current workspace.
key = "prefix+ctrl+e"
type = "pane"
description = "Open nvim"
command = "nvim"

[ui]
# Confirm workspace closure; use prefix+q to detach instead.
confirm_close = true

# Copy pane selections through Herdr rather than the outer terminal.
copy_on_select = true

# Put agents that need attention near the top of the panel.
agent_panel_sort = "priority"

# Show detected agent names in split pane borders.
show_agent_labels_on_pane_borders = true

[ui.toast]
# Use OS notifications for background agent state changes.
delivery = "system"
delay_seconds = 1

[session]
# Resume supported agent panes after a Herdr server restart.
resume_agents_on_restore = true

[theme]

[theme.custom]
# Base terminal-aligned surfaces.
panel_bg = "#020b16"
surface_dim = "#030d18"
surface0 = "#04111e"
surface1 = "#071827"
overlay0 = "#1b3144"
overlay1 = "#294056"

# Cold text palette.
text = "#c8d7e8"
subtext0 = "#8ea3b8"

# Workspace and agent status colors.
green = "#a5e9ff"
yellow = "#4f8cff"

# Tab and accent colors.
accent = "#2f5f78"
blue = "#2f5f78"
teal = "#67d4e8"
mauve = "#8fa8c8"
